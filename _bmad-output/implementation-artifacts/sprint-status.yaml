# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story packet created, ready for development
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review
#   - done: Story completed
#
# Every epic-N.M key is preceded by a comment line carrying its exact title (from the epic file's
# own `title:` frontmatter), e.g.:
#   # Platform estate is provisioned, verifiable, and CNP-compliant
#   epic-1.0: backlog
# The comment sits on its OWN line, never trailing after the status, and the key itself stays a
# bare `epic-N.M` — both on purpose. scripts/dispatch-preflight.sh's depends_on check extracts a
# prerequisite epic's status with `${dline##*:}` and only trims whitespace, not a `#...` suffix; a
# trailing same-line comment would corrupt that extraction (e.g. `backlog # Title` is never `done`,
# permanently blocking every dependent story). A slugged key (as story keys carry) would break the
# check even earlier, since it greps `^epic-N.M:` with nothing between the id and the colon.
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# CTAM POLYREPO CAVEATS — read before trusting a status here:
# ===========================================================
# 1. Story packets do NOT live in story_location. CTAM is a 16-repo polyrepo, so a packet is
#    landed in its TARGET SERVICE REPO at docs/stories/<story_id>.md (see delivery-operating-model.md
#    and _bmad/custom/bmad-create-story.toml). Sprint planning's file-existence detection therefore
#    cannot upgrade a status here — statuses in this file are set when a story is dispatched and
#    when it is signalled, not auto-detected.
# 2. The packet's own `Status:` line is authoritative for a story in flight. This file is the
#    programme-level rollup across repos.
# 3. ONE DISPATCHER AT A TIME. This is a single file, so concurrent dispatch would conflict.
#    Coordination is by convention (one person dispatches), with the branch-existence check in
#    scripts/dispatch-preflight.sh as the backstop against double-pickup.


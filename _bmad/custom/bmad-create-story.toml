# CTAM team customization for bmad-create-story.
#
# Committed deliberately. `_bmad/*` is gitignored because the installer owns it, but
# `_bmad/custom/` is the team-owned layer BMad itself designates as committed — see the header of
# `_bmad/config.toml`. A `.gitignore` negation keeps this file (and only this file's siblings)
# tracked; `*.user.toml` stays personal and ignored.
#
# WHY THIS EXISTS
# BMad's default story template and output location assume a monorepo. CTAM is a 16-repo polyrepo
# in which the packet must travel WITH the service repo, and must carry the bus version and FR/NFR
# mapping BMad does not model. Those two facts were previously written only as prose in
# delivery-operating-model.md, which is why a hand-authored packet diverged from BMad's template
# and left bmad-dev-story with no Tasks to work through. This file makes the reconciliation
# executable instead of aspirational.

# FOR TEAMMATES — what this file needs in order to work
#
# 1. Install the BMad plugin. `_bmad/` and `.claude/skills/bmad-*` are installer-managed and
#    gitignored; only this `_bmad/custom/` layer is committed. Without the plugin there are no
#    skills for these overrides to apply to.
# 2. Lay your checkouts out as SIBLINGS. Every path below is relative to this repo, and the model
#    assumes `ctam-analysis`, `ctam-architecture` and each service repo share one parent:
#
#       ~/…/hmcts/
#         ├── ctam-analysis/          (control plane — you dispatch from here)
#         ├── ctam-architecture/      (context bus — holds the packet template)
#         └── ctam-<service>/         (execution unit — packets land here)
#
#    A different layout breaks both the packet-template lookup and the output location.
# 3. `config.user.toml` in this directory is personal and stays gitignored. Put anything
#    machine-specific there, never in this file.

[workflow]

activation_steps_append = [
  "CTAM STORY IDENTITY — a CTAM story id has THREE parts, `<phase>.<epic>.<story>` (e.g. `0.1.4`), because epics are numbered `<phase>.<epic>` (`epic-0.1-…`). BMad's default parse of a sprint-status key takes the FIRST number as the epic and the SECOND as the story, which for `0-1-4-mrd-…` yields `0.1` — the same id, path and branch for every story in the epic. Override the BINDINGS, not just the id, because `template.md` and later steps use these names: `{{epic_num}}` = `0.1` (the first TWO numbers, dotted), `{{story_num}}` = `4` (the THIRD number), `{{story_id}}` = `0.1.4`, the owning epic = `epic-0.1` (glob `epic-0.1-*.md`, not `epic-0-*.md`), and `{{story_title}}` = the PROSE title from that epic's `## Story 0.1.4: <title>` heading, NOT the dashed slug from the sprint key. Binding `{{epic_num}}`/`{{story_num}}` this way makes `template.md`'s `# Story {{epic_num}}.{{story_num}}: {{story_title}}` render the required three-part H1 by construction, and makes `epic-{{epic_num}}` resolve to the real sprint-status key `epic-0.1`. Where a step matches a sprint-status STORY key instead, use the DASHED form (`0-1-4-…`, and `0-1-1-…` for the first-story-in-epic check) — dotted for ids, paths, branches and the `epic-` key; dashed for story keys. `{{story_key}}` is unaffected — it stays the full sprint-status key. EVERY use of the id takes the three-part form: the packet path `docs/stories/0.1.4.md`, the frontmatter `story_id`, the `story/0.1.4` branch, the `<story-id>` argument to `dispatch-preflight.sh` and the packet path passed to `validate-story-packet.sh`, and the packet's H1 (`# Story 0.1.4: <title>`). `scripts/validate-story-packet.sh` enforces this, so a two-part id fails the gate. THE DIRECT-INVOCATION BRANCH NEEDS THE SAME TREATMENT: on `create story 0.1.4` — the normal way this workflow is invoked here — workflow step 1 parses a user-supplied id in `1-2-user-auth` shape and sets `{{story_key}}` FROM USER INPUT, never reading sprint-status.yaml. Step 6's `Find development_status key matching {{story_key}}` and the packet's `sprint_status_key` both rest on that value, so a synthesized one silently mis-targets the rollup. NEVER synthesize `{{story_key}}` — look the dashed id up in `{implementation_artifacts}/sprint-status.yaml` (`grep -nE '^  0-1-4-'`) and use the matched key verbatim; if nothing matches, HALT and say so rather than invent one. `validate-story-packet.sh` checks only that `sprint_status_key` carries the right id prefix, so a plausible truncation of the slug passes the gate.",

  "CTAM EPIC INPUT — the skill's `Input Files` table globs epics as sharded `{planning_artifacts}/*epic*/*.md`, which in CTAM resolves to `epics/*.md` — `framework.md`, `index.md`, `fr-coverage-map.md`, `requirements-inventory.md` — and matches NO epic file, because CTAM's epics sit one level deeper at `epics/phase-<phase>/epic-<phase>.<epic>-*.md` with the stories embedded inside each epic. `discover-inputs.md` step 2c treats a miss as 'not an error, just unavailable', so `{epics_content}` comes back EMPTY and step 2's EPIC ANALYSIS and STORY FOUNDATION have nothing to read — the user-story statement, the acceptance criteria, the cross-story context and the epic's `repo:`/`depends_on:` frontmatter all silently go missing, and the ACs get INVENTED instead of carried across. That is the one failure this workflow must never have. BIND THE INPUT EXPLICITLY: set `{epics_content}` to the FULL text of `{planning_artifacts}/epics/phase-{{phase_num}}/epic-{{epic_num}}-*.md`, where `{{phase_num}}` is the first number of the story id (story `0.1.4` → `epics/phase-0/epic-0.1-*.md`), and additionally load `{planning_artifacts}/epics/framework.md` and `{planning_artifacts}/epics/index.md` for cross-epic context. HALT if that glob matches no file, or more than one — a wrong or ambiguous epic makes every downstream field wrong. THIS STORY'S MATERIAL is the `## Story {{story_id}}: <title>` section of that epic, read through to the next `## Story` heading: take the `As a / I want / So that` statement, the `**Acceptance Criteria:**` block VERBATIM (the epics author them in Gherkin and T6 requires each AC number to resolve into a test `@DisplayName`, so renumbering or paraphrasing breaks traceability), the `**References:**` line as the source for the `frs`/`nfrs` frontmatter, and the `**Explicitly NOT in scope:**` list as the seed for `### Out of scope / boundaries`.",

  "CTAM PRE-DISPATCH CHECK — before writing the packet, run `{project-root}/scripts/dispatch-preflight.sh <story-id>` and stop if it reports a blocker. It confirms the story is still `backlog` in sprint-status.yaml, that no branch on the target remote already claims it, that the epic's `depends_on` are `done`, and that no EARLIER story in the same epic is still `backlog` — stories inside a CTAM epic are ordered by construction (scaffold, then schema, then ingestion) and no field records that, so the order in sprint-status.yaml is the dependency. Coordination in the control plane is by convention — ONE DISPATCHER AT A TIME — and this is the backstop.",

  "CTAM EPIC STATUS GUARDS — workflow step 1 carries three guards on the owning epic: flip `epic-{{epic_num}}` from `backlog` to `in-progress` when this is the first story dispatched in it, HALT if the epic is already `done`, and HALT on an unrecognised epic status. ALL THREE SIT ONLY INSIDE THE AUTO-DISCOVERY BRANCHES. The direct invocation `create story 0.1.4` jumps straight to `GOTO step 2a` and skips every one of them — which is why `epic-0.1` can still read `backlog` in sprint-status.yaml while its stories are being dispatched. RUN THE BLOCK ON THE DIRECT-INVOCATION BRANCH TOO, against the dotted key `epic-{{epic_num}}` (`epic-0.1`, never `epic-0`), and make the epic edit in the SAME change as the story's own status flip in step 6, so the rollup is never left half-updated. 'First story in the epic' means no other story in this epic is past `backlog` — determine that by scanning the dashed prefix in sprint-status.yaml (`grep -E '^  0-1-'`), NOT by the skill's `{{epic_num}}-1-*` file-existence check, because in CTAM the packet does not live where sprint planning looks for it.",

  "CTAM PACKET CONTRACT — read the canonical template at `{project-root}/../ctam-architecture/agent-rules/templates/story-packet.md` and use it in place of this skill's `template.md`. It IS BMad's template, with CTAM's frontmatter added and CTAM detail nested under `## Dev Notes`. Keep every BMad top-level section at BMad's heading level with BMad's spelling — `## Story`, `## Acceptance Criteria`, `## Tasks / Subtasks`, `## Dev Notes`, `## Dev Agent Record`, `### File List` — because bmad-dev-story reads and writes them by exact heading. STEP 5 EMITS ELEVEN NAMED OUTPUTS WITH NO HOME IN THIS TEMPLATE — `developer_context_section`, `technical_requirements`, `architecture_compliance`, `library_framework_requirements`, `file_structure_requirements`, `testing_requirements`, `previous_story_intelligence`, `git_intelligence_summary`, `latest_tech_information`, `project_context_reference`, `story_completion_status`. Written literally each becomes a new `##` top-level section, which breaks the contract. Route every one into an existing home: `developer_context_section` IS `## Dev Notes` itself; `technical_requirements`, `architecture_compliance`, `library_framework_requirements` and `latest_tech_information` → `### Context distilled from the bus`; `project_context_reference` → `### Rules that apply`; `file_structure_requirements` → `### Project Structure Notes`; `testing_requirements` → `### Definition of done`; `previous_story_intelligence` and `git_intelligence_summary` → a `### Previous story intelligence` subsection of `## Dev Notes` (a new `###` is fine — it nests); `story_completion_status` is the `Status:` line, not a section at all. `validate-story-packet.sh` ALLOWLISTS the permitted `##` headings, so any promoted section fails the gate by construction rather than only when someone predicted its name.",

  "CTAM OUTPUT LOCATION — write the packet to the TARGET SERVICE REPO at `docs/stories/{{story_id}}.md`, NOT to `{implementation_artifacts}`. Resolve the target repo from the **owning epic's frontmatter** (`repo:` in `{project-root}/_bmad-output/planning-artifacts/epics/phase-*/epic-<num>-*.md`); the repo checkout is a sibling directory of `{project-root}`. `{implementation_artifacts}` holds programme-level state such as `sprint-status.yaml` — never the packet. Rationale: a service repo must be independently readable by a fresh session or a human with none of the control plane's context (delivery-operating-model.md → Execution units). REBIND, DON'T JUST REDIRECT: the skill's `Paths` block sets `default_output_file` = `{implementation_artifacts}/{{story_key}}.md`, and every `<template-output>` in step 5 (ten of them), the checklist validation in step 6 and the completion report all reference `{default_output_file}` / `{{story_file}}` / `{story_file_path}` (the name `checklist.md` uses) BY NAME. Redirecting only in prose leaves those variables pointing at the control plane, so any step that follows a variable rather than this instruction writes the packet to `{implementation_artifacts}`. Set `{default_output_file}`, `{{story_file}}` AND `{story_file_path}` all to `<target-repo>/docs/stories/{{story_id}}.md` — same reasoning as the STORY IDENTITY bindings above. IF THE TARGET REPO IS NOT CHECKED OUT as a sibling, clone it first (`git clone https://github.com/hmcts/<repo>.git {project-root}/../<repo>`) — do not assume it is there, because early in the programme most of the 15 execution units do not exist locally yet. If the clone fails because the remote does not exist or you have no access — exactly the case `dispatch-preflight.sh` warns about — HALT AND SAY SO BEFORE touching sprint-status.yaml. NEVER fall back to writing the packet somewhere inside `{project-root}`: a packet in the control plane is invisible to the implementing session, and it leaves the rollup claiming a dispatch that never happened.",

  "CTAM BUS-REPO STORIES — three Phase 0 stories target `ctam-architecture` ITSELF (0.0.0 the GitHub setup runbook, 0.4.1 the identity-bootstrap runbook, 0.6.2 the shared Liquibase baseline), and the bus cannot submodule itself. In those packets `_arch/...` RESOLVES TO NOTHING: the rules sit at `agent-rules/<file>.md` and the architecture at `architecture/<file>.md`, at the repo root. Cite them WITHOUT the `_arch/` prefix and say in `## Dev Notes` that this packet targets the bus repo, so the next reader is not hunting a submodule that is not there. `bus_version` records the CURRENTLY PUBLISHED tag the work starts from (the pin has no meaning inside the bus); if the story's output is itself destined for the next tag, note that under `### Recorded deviations` and name the tag — a session cannot create it. Also expect no per-repo agent wiring: `ctam-architecture` has no `CLAUDE.md` and no `.claude/hooks/`, because `CLAUDE.md.template` is written for `ctam-<service>` execution units. A cold session there therefore starts with NO rules loaded and NO commit protection, so the packet must carry the rules it depends on inline rather than by reference, and must state that `main` discipline is on the operator.",

  "CTAM PREVIOUS-STORY INTELLIGENCE — workflow step 2 looks for the preceding story at `{implementation_artifacts}/{{epic_num}}-{{previous_story_num}}-*.md`. In CTAM that path never holds a packet, so the step silently finds nothing and every story ships without the carry-forward the skill treats as critical. Look instead in the TARGET SERVICE REPO at `docs/stories/<phase>.<epic>.<n>.md`, taking the highest `<n>` below `{{story_num}}`; check the `story/*` branches too (`git ls-remote --heads`, then fetch the branch) because the preceding packet is landed on its own claim branch and may not be merged to `main` yet. Read its `## Dev Notes`, `## Dev Agent Record` and `### File List` for established patterns, review feedback and the files it touched. If the preceding story is genuinely absent — not yet dispatched, or owned by a different repo — record that in `## Dev Notes` rather than leaving the omission silent.",

  "CTAM FRONTMATTER — populate `story_id`, `epic`, `repo`, `bus_version`, `frs`, `nfrs`, `depends_on_stories` and `sprint_status_key` (the story's key in `{implementation_artifacts}/sprint-status.yaml`, e.g. `0-1-4-mrd-supplementary-reference-data-is-ingested-from-the-weekly-excel-feed`). `frs`/`nfrs` come from the story's `**References:**` line in the epic. `depends_on_stories` is recorded as a field NOWHERE, so derive it rather than defaulting it to `[]`: the earlier stories in the SAME epic that this one actually rests on (CTAM epics are ordered by construction — scaffold, then schema, then ingestion), plus any story the story's own prose names as a prerequisite. Use three-part ids (`[0.1.1, 0.1.2]`); leave it `[]` only when the story genuinely stands alone. Take `bus_version` from the target repo's `_arch` submodule pin, not from the epic's stated aspiration; if they differ, say so as a recorded deviation. NEVER add a `status:` key to the frontmatter — the `Status:` line is the single source of status, in BMad's vocabulary (`ready-for-dev | in-progress | review | done`). The same vocabulary is used in sprint-status.yaml, which is the programme-level rollup: set the story there to `ready-for-dev` in the same change as the packet.",

  "CTAM CONTEXT DEPTH — under `## Dev Notes`, distil what THIS story needs from the pinned bus and cite file + heading for every technical claim (agent-rules R4). Name the specific rule ids that will bite on this story. Include `### Out of scope / boundaries`, and `### Recorded deviations` whenever the story departs from its epic or from a rule, with the id, the rule affected and who approved it. READ THE BUS AT THE PIN, NOT AT HEAD. The skill's `Input Files` table FULL_LOADs `{planning_artifacts}/architecture/*.md` — the CONTROL PLANE's live architecture, which runs ahead of every published tag. The implementing session resolves `_arch/...` at `bus_version`, so a citation distilled from the control-plane copy can name a heading, a rule or a whole file that does not exist at the pin, and a cold session then cannot follow its own packet. Read the pinned text itself: `git -C {project-root}/../ctam-architecture show <bus_version>:architecture/<file>.md` (and `:agent-rules/<file>.md`), and compare it against the control-plane copy for anything this story relies on. IF THE PIN PREDATES A RULE THIS PACKET DEPENDS ON, stop and say which tag is needed and why — a session cannot create an `arch-vN` tag, that is a human release action. WORKED EXAMPLE: `arch-v1.0` does NOT contain `agent-rules/templates/story-packet.md`, the PR-as-gate policy or one-branch-per-story, so a packet stamped `bus_version: arch-v1.0` would cite a bus that cannot corroborate its own shape. `arch-v1.1` (tagged 2026-08-20) is the first pin that carries all three, and is therefore the MINIMUM `bus_version` for any packet written against this file. If the target repo's `_arch` submodule still points at `arch-v1.0`, bump the pin before dispatch and record it — that bump is an ordinary commit in the service repo, not a release action, so it is yours to make.",

  "CTAM VALIDATION GATE — in workflow step 6 (`Update sprint status and finalize`), immediately after the packet is saved and BEFORE the sprint-status update, run `{project-root}/scripts/validate-story-packet.sh <path-to-packet>` and fix every error it reports. Do NOT flip the story to `ready-for-dev` in sprint-status.yaml on a packet the validator rejects — the rollup must never run ahead of a valid packet.",

  "CTAM CONTROL-PLANE BRANCH — the sprint-status update in workflow step 6 writes `{implementation_artifacts}/sprint-status.yaml` in THIS repo, where `main` is protected by `.claude/hooks/block-git-writes.sh`. Before that write, make sure `{project-root}` is on a feature branch and commit the sprint-status change there. IF HEAD IS ALREADY ON A FEATURE BRANCH, COMMIT ON IT — do not cut a second branch off it. If HEAD is on `main`, `git switch -c chore/dispatch-{{story_id}}`: `conventions.md` Git conventions sanction exactly four prefixes — `story/{story-id}` (reserved for the claim branch in the TARGET repo), `bugfix/`, `chore/` and `feature/` — so a control-plane dispatch commit is a `chore/`. Do not invent a `dispatch/` prefix; this file exists to serve the consistency contract, not to be the thing that breaks it. Committing on `main` is denied by the hook, which would strand the dispatch: packet pushed in the target repo, rollup uncommitted here. Do not open the control-plane pull request — that is the human gate.",

  "CTAM DISPATCH BRANCH — the packet must still be landed on its claim branch in the target repo; the full procedure runs as the terminal step of this workflow (see `on_complete`)."
]


persistent_facts = [
  "file:{project-root}/_bmad-output/planning-artifacts/architecture/delivery-operating-model.md",
  "CTAM Pathfinder ships as a 16-repo polyrepo with NO shared runtime library. Consistency comes from CI, ArchUnit, Spectral, Pact and review — never from shared code.",
  "The implementing session is a COLD session in the service repo, with only its CLAUDE.md, this packet, and the pinned `_arch/` submodule. Anything it needs and cannot find is a defect in the packet. Assume no shared context with the control plane.",
  "`main` is protected and the pull request is the human gate (SCP 2026-08-19c). A session may branch, commit and push a feature branch in the target repo; it must never write to `main`, force-push, tag, or use the GitHub CLI. The packet is written into the target repo's working tree — see the DISPATCH BRANCH step for what to do with it.",
  "Every service repo consumes the published architecture as a git submodule at `_arch/`, pinned to an exact `arch-vN` tag. Cite architecture as `_arch/architecture/<file>.md#<heading>` — the path the implementing session will actually resolve. The pin is a CONTENT boundary, not just a version string: text that exists only after the pinned tag cannot be cited.",
  "The packet template is `{project-root}/../ctam-architecture/agent-rules/templates/story-packet.md`, not this skill's `template.md`. Every BMad top-level heading keeps BMad's exact level and spelling — `## Story`, `## Acceptance Criteria`, `## Tasks / Subtasks`, `## Dev Notes`, `## Dev Agent Record`, `### File List` — because bmad-dev-story reads and writes them by exact heading."
]

on_complete = """
CTAM DISPATCH BRANCH — the packet is landed ON A BRANCH in the target repo, and that branch is the claim on the story. In the target repo: (a) make sure `main` is current (`git switch main && git pull`); (b) `git switch -c story/{{story_id}}` — e.g. `story/0.1.4`, per conventions.md Git conventions; (c) `git add docs/stories/{{story_id}}.md` and commit it as `docs: land story packet {{story_id}}`; (d) `git push -u origin story/{{story_id}}`. Push it — `scripts/dispatch-preflight.sh` reads the REMOTE, so an unpushed branch claims nothing. ONE BRANCH PER STORY: the implementing session continues on this same branch and must NOT create a second one. Do NOT open the pull request (the GitHub CLI is unavailable to sessions, and opening, approving and merging the PR is the human gate). Report the branch name and the compare URL in the dispatch summary. IF THE PUSH FAILS (no access, or the repo does not exist yet — `dispatch-preflight.sh` warns about exactly this), stop and put the story's sprint-status entry back to `backlog` first: step 6 has already flipped it to `ready-for-dev`, and a rollup saying `ready-for-dev` with no branch on the remote makes the next `dispatch-preflight.sh` report a false `already dispatched` blocker on a story nobody is building.
"""

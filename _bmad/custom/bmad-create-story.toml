# CTAM team customization for bmad-create-story.
#
# Committed deliberately. `_bmad/*` is gitignored because the installer owns it, but
# `_bmad/custom/` is the team-owned layer BMad itself designates as committed — see the header of
# `_bmad/config.toml`. A `.gitignore` negation keeps this file (and only this file's siblings)
# tracked; `*.user.toml` stays personal and ignored.
#
# WHY THIS EXISTS
# BMad's default story template and output location assume a monorepo. CTAM is a 16-repo polyrepo
# in which the packet must travel WITH the service repo, and must carry the bus version and FR/NFR
# mapping BMad does not model. Those two facts were previously written only as prose in
# delivery-operating-model.md, which is why a hand-authored packet diverged from BMad's template
# and left bmad-dev-story with no Tasks to work through. This file makes the reconciliation
# executable instead of aspirational.

# FOR TEAMMATES — what this file needs in order to work
#
# 1. Install the BMad plugin. `_bmad/` and `.claude/skills/bmad-*` are installer-managed and
#    gitignored; only this `_bmad/custom/` layer is committed. Without the plugin there are no
#    skills for these overrides to apply to.
# 2. Lay your checkouts out as SIBLINGS. Every path below is relative to this repo, and the model
#    assumes `ctam-analysis`, `ctam-architecture` and each service repo share one parent:
#
#       ~/…/hmcts/
#         ├── ctam-analysis/          (control plane — you dispatch from here)
#         ├── ctam-architecture/      (context bus — holds the packet template)
#         └── ctam-<service>/         (execution unit — packets land here)
#
#    A different layout breaks both the packet-template lookup and the output location.
# 3. `config.user.toml` in this directory is personal and stays gitignored. Put anything
#    machine-specific there, never in this file.

[workflow]

activation_steps_append = [
  "CTAM PACKET CONTRACT — read the canonical template at `{project-root}/../ctam-architecture/agent-rules/templates/story-packet.md` and use it in place of this skill's `template.md`. It IS BMad's template, with CTAM's frontmatter added and CTAM detail nested under `## Dev Notes`. Keep every BMad top-level section at BMad's heading level with BMad's spelling — `## Story`, `## Acceptance Criteria`, `## Tasks / Subtasks`, `## Dev Notes`, `## Dev Agent Record`, `### File List` — because bmad-dev-story reads and writes them by exact heading.",

  "CTAM OUTPUT LOCATION — write the packet to the TARGET SERVICE REPO at `docs/stories/{{story_id}}.md`, NOT to `{implementation_artifacts}`. Resolve the target repo from the **owning epic's frontmatter** (`repo:` in `{project-root}/_bmad-output/planning-artifacts/epics/phase-*/epic-<num>-*.md`); the repo checkout is a sibling directory of `{project-root}`. `{implementation_artifacts}` holds programme-level state such as `sprint-status.yaml` — never the packet. Rationale: a service repo must be independently readable by a fresh session or a human with none of the control plane's context (delivery-operating-model.md → Execution units).",

  "CTAM FRONTMATTER — populate `story_id`, `epic`, `repo`, `bus_version`, `frs`, `nfrs`, `depends_on_stories` and `sprint_status_key` (the story's key in `{implementation_artifacts}/sprint-status.yaml`, e.g. `0-1-4-mrd-supplementary-reference-data-is-ingested-from-the-weekly-excel-feed`). Take `bus_version` from the target repo's `_arch` submodule pin, not from the dispatch graph's aspiration; if they differ, say so as a recorded deviation. NEVER add a `status:` key to the frontmatter — the `Status:` line is the single source of status, in BMad's vocabulary (`ready-for-dev | in-progress | review | done`). The same vocabulary is used in sprint-status.yaml, which is the programme-level rollup: set the story there to `ready-for-dev` in the same change as the packet.",

  "CTAM CONTEXT DEPTH — under `## Dev Notes`, distil what THIS story needs from the pinned bus and cite file + heading for every technical claim (agent-rules R4). Name the specific rule ids that will bite on this story. Include `### Out of scope / boundaries`, and `### Recorded deviations` whenever the story departs from its epic or from a rule, with the id, the rule affected and who approved it.",

  "CTAM PRE-DISPATCH CHECK — before writing the packet, run `{project-root}/scripts/dispatch-preflight.sh <story-id>` and stop if it reports a blocker. It confirms the story is still `backlog` in sprint-status.yaml, that no branch on the target remote already claims it, and that the epic's `depends_on` are `done`. Coordination in the control plane is by convention — ONE DISPATCHER AT A TIME — and this is the backstop.",

  "CTAM VALIDATION GATE — after writing the packet, run `{project-root}/scripts/validate-story-packet.sh <path-to-packet>` and fix every error it reports before reporting the story ready. Do not report a packet the validator rejects."
]

persistent_facts = [
  "file:{project-root}/_bmad-output/planning-artifacts/architecture/delivery-operating-model.md",
  "CTAM Pathfinder ships as a 16-repo polyrepo with NO shared runtime library. Consistency comes from CI, ArchUnit, Spectral, Pact and review — never from shared code.",
  "The implementing session is a COLD session in the service repo, with only its CLAUDE.md, this packet, and the pinned `_arch/` submodule. Anything it needs and cannot find is a defect in the packet. Assume no shared context with the control plane.",
  "`main` is protected and the pull request is the human gate (SCP 2026-08-19c). A session may branch, commit and push a feature branch in the target repo; it must never write to `main`, force-push, tag, or use the GitHub CLI. The packet is written into the target repo's working tree — see the DISPATCH BRANCH step for what to do with it.",
  "Every service repo consumes the published architecture as a git submodule at `_arch/`, pinned to an exact `arch-vN` tag. Cite architecture as `_arch/architecture/<file>.md#<heading>` — the path the implementing session will actually resolve."
]

on_complete = ""
